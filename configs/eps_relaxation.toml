[experiment]
benchmark = "random_quadratic"
base_seed = 20250601
time_limit = 3600
modes = ["solve", "root", "relaxation"]
root_time_limit = 600
relaxation_time_limit = 600

[instances]
n_dimensions = [3, 5, 7]
n_disjunctions = [3, 6, 10]
n_disjuncts_per_disjunction = [10, 15]
n_constraints_per_disjunct = 10
n_feasible_regions = 10
ensure_positive_definite = true
replicate = [1, 2]

[[strategies]]
name = "gdp.hull"
label = "hull-eps-1e-1"
[strategies.options]
EPS = 1e-1

[[strategies]]
name = "gdp.hull"
label = "hull-eps-1e-2"
[strategies.options]
EPS = 1e-2

[[strategies]]
name = "gdp.hull"
label = "hull-eps-1e-3"
[strategies.options]
EPS = 1e-3

[[strategies]]
name = "gdp.hull"
label = "hull-eps-1e-4"
[strategies.options]
EPS = 1e-4

[[strategies]]
name = "gdp.hull"
label = "hull-eps-1e-5"
[strategies.options]
EPS = 1e-5

[[strategies]]
name = "gdp.hull"
label = "hull-eps-1e-6"
[strategies.options]
EPS = 1e-6

[[solvers]]
name = "gams"
subsolver = "gurobi"

[[solvers]]
name = "gams"
subsolver = "scip"
